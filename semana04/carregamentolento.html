<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/carregamentolento.css">
    <script src="scripts/carregamentolento.js" defer></script>
   
    <title>Lazy Loading Images</title>
</head>
<body>
    <main>
        <h1>Carregamento Lento de Imagens</h1>
         <img src="https://picsum.photos/400/600?random=1"
         alt="Paisagem 1"
         width="400"
         height="600"
         loading="lazy">

    <img src="https://picsum.photos/400/600?random=2"
         alt="Paisagem 2"
         width="400"
         height="600"
         loading="lazy">

    <img src="https://picsum.photos/400/600?random=3"
         alt="Paisagem 3"
         width="400"
         height="600"
         loading="lazy">

    <img src="https://picsum.photos/400/600?random=4"
         alt="Paisagem 4"
         width="400"
         height="600"
         loading="lazy">

    <img src="https://picsum.photos/400/600?random=5"
         alt="Paisagem 5"
         width="400"
         height="600"
         loading="lazy">

    <img src="https://picsum.photos/400/600?random=6"
         alt="Paisagem 6"
         width="400"
         height="600"
         loading="lazy">
    </main>
    <footer>
    <p>&copy; <span id="currentyear"></span> Gabriel Wallace</p>
    <p>Última modificação: <span id="lastModified"></span></p>
</footer>
</body>
</html>
