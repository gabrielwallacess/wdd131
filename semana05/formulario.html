<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação de Produto</title>

<meta name="description" content="Envie sua avaliação de um produto preenchendo o formulário com nota, comentários e informações sobre a instalação.">
<meta name="author" content="Gabriel Wallace">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="estilo/formulario.css">

<script src="scripts/formulario.js" defer></script>

</head>

<body>

<header>
<h1>Avaliação de Produto</h1>
</header>

<main>

<form method="get" action="avaliacao.html">

<div class="campo">

<label for="produto">Nome do Produto *</label>

<select id="produto" name="produto" required>

<option value="" selected disabled>Selecione um produto...</option>

</select>

</div>

<div class="campo">

<p>Classificação Geral *</p>

<div class="estrelas">

<input type="radio" id="nota1" name="avaliacao" value="1" required>
<label for="nota1">☆</label>

<input type="radio" id="nota2" name="avaliacao" value="2" required>
<label for="nota2">☆☆</label>

<input type="radio" id="nota3" name="avaliacao" value="3" required>
<label for="nota3">☆☆☆</label>

<input type="radio" id="nota4" name="avaliacao" value="4" required>
<label for="nota4">☆☆☆☆</label>

<input type="radio" id="nota5" name="avaliacao" value="5" required>
<label for="nota5">☆☆☆☆☆</label>

</div>

</div>

<div class="campo">

<label for="data">Data de Instalação *</label>

<input
type="date"
id="data"
name="data"
required>

</div>

<div class="campo">

<p>Recursos Úteis</p>

<input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade">
<label for="durabilidade">Durabilidade</label>

<input type="checkbox" id="facilidade" name="recursos" value="Facilidade de uso">
<label for="facilidade">Facilidade de uso</label>

<input type="checkbox" id="desempenho" name="recursos" value="Desempenho">
<label for="desempenho">Desempenho</label>

<input type="checkbox" id="design" name="recursos" value="Design">
<label for="design">Design</label>

</div>

<div class="campo">

<label for="comentario">Avaliação Escrita</label>

<textarea
id="comentario"
name="comentario"
rows="5">
</textarea>

</div>

<div class="campo">

<label for="usuario">Nome de Usuário</label>

<input
type="text"
id="usuario"
name="usuario">

</div>

<input type="submit" value="Enviar Avaliação">

</form>

</main>

<footer>

<p>
©
<span id="ano"></span>
Gabriel Wallace
</p>

<p id="ultimaModificacao"></p>

</footer>

</body>
</html>
